# Run the whole of Mavna yourself, which the specification requires be possible:
# no mandatory hosted service, no account with this project, every endpoint
# yours to point elsewhere.
#
#   SPONSOR_SECRET_KEY=S... docker compose up
#
# Two services after a one-off build. The app is static files behind a web
# server; the sponsor is the one process with a key, and its section says
# exactly what that key can do.
services:
  # Installs and builds once for both services. Two installs into the one
  # checkout race on pnpm's store and fail. Built through turbo with the
  # trailing "...", because the workspace packages resolve to their dist/ and a
  # fresh checkout has none.
  build:
    image: node:24.22.0-alpine
    working_dir: /repo
    volumes:
      - .:/repo
    command: >
      sh -c "corepack enable pnpm 2>/dev/null || npm i -g pnpm@12.14.0;
             pnpm install --frozen-lockfile &&
             pnpm turbo run build --filter=@mavna/app... --filter=@mavna/sponsor-service..."
    # The app's settings are inlined when it is built, so they belong here. The
    # build refuses to run without a sponsor url; this one is the sponsor below.
    environment:
      VITE_MAVNA_NETWORK: ${MAVNA_NETWORK:-testnet}
      VITE_STELLAR_RPC_URL: ${STELLAR_RPC_URL:-}
      VITE_MAVNA_SPONSOR_URL: ${MAVNA_SPONSOR_URL:-http://localhost:8787}
      VITE_MAVNA_DISABLED_SOURCES: ${MAVNA_DISABLED_SOURCES:-}
      VITE_MAVNA_NETWORKS: ${MAVNA_NETWORKS:-}
      VITE_MAVNA_TESTNET_RPC_URL: ${MAVNA_TESTNET_RPC_URL:-}
      VITE_MAVNA_TESTNET_SPONSOR_URL: ${MAVNA_TESTNET_SPONSOR_URL:-}
      VITE_MAVNA_MAINNET_RPC_URL: ${MAVNA_MAINNET_RPC_URL:-}
      VITE_MAVNA_MAINNET_SPONSOR_URL: ${MAVNA_MAINNET_SPONSOR_URL:-}

  app:
    image: node:24.22.0-alpine
    working_dir: /repo/apps/app
    volumes:
      - .:/repo
    depends_on:
      build:
        condition: service_completed_successfully
    # Preview rather than dev: the dev server inlines CSS through Vite's own
    # pipeline, which serves a bundle no integrator ever receives.
    command: node_modules/.bin/vite preview --host --port 4319 --strictPort
    ports:
      - "4319:4319"

  # The only process holding a key. It prepares accounts it pays for, triggers
  # deliveries whose recipient Circle's attestation already fixed, finishes
  # overdue conversions on arrival as fee source, and funds its own channels,
  # executor and the Arrival Contract's renewal. It cannot touch user funds;
  # that is checkable by reading services/sponsor.
  sponsor:
    image: node:24.22.0-alpine
    working_dir: /repo
    depends_on:
      build:
        condition: service_completed_successfully
    command: node services/sponsor/dist/main.mjs
    # Loopback only. Clients reach it through the reverse proxy in front, which
    # is what MAVNA_TRUST_PROXY=true assumes: a port open to the world would let
    # anyone set X-Forwarded-For and choose their own rate-limit identity.
    ports:
      - "127.0.0.1:8787:8787"
    # Caps, held settlements and channel keys. It holds secret keys, so it is a
    # named volume rather than a directory in the checkout. The state records
    # its network, and the sponsor refuses to start on another one against it.
    volumes:
      - .:/repo
      - sponsor-state:/var/lib/mavna
    environment:
      MAVNA_NETWORK: ${MAVNA_NETWORK:-testnet}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-}
      SPONSOR_SECRET_KEY: ${SPONSOR_SECRET_KEY:?the sponsor cannot pay without its key}
      MAVNA_ALLOWED_ORIGINS: ${MAVNA_ALLOWED_ORIGINS:-http://localhost:4319}
      MAVNA_IRIS_URL: ${MAVNA_IRIS_URL:-}
      MAVNA_SETTLE_SWEEP_SECONDS: ${MAVNA_SETTLE_SWEEP_SECONDS:-}
      MAVNA_RESERVE_FUNDING: ${MAVNA_RESERVE_FUNDING:-sponsor}
      MAVNA_STATE_DIR: ${MAVNA_STATE_DIR:-/var/lib/mavna}
      MAVNA_PRODUCTION: ${MAVNA_PRODUCTION:-}
      MAVNA_CAP_STRANDING_PER_DAY: ${MAVNA_CAP_STRANDING_PER_DAY:-}
      MAVNA_CAP_VOLUME_EXPENSIVE_PER_DAY: ${MAVNA_CAP_VOLUME_EXPENSIVE_PER_DAY:-}
      MAVNA_CAP_VOLUME_CHEAP_PER_DAY: ${MAVNA_CAP_VOLUME_CHEAP_PER_DAY:-}
      MAVNA_MIN_DELIVERY_USDC: ${MAVNA_MIN_DELIVERY_USDC:-}
      MAVNA_DELIVERY_BUDGET_XLM: ${MAVNA_DELIVERY_BUDGET_XLM:-}
      MAVNA_RATE_LIMIT_PER_MINUTE: ${MAVNA_RATE_LIMIT_PER_MINUTE:-}
      MAVNA_TRUST_PROXY: ${MAVNA_TRUST_PROXY:-}
      MAVNA_CHANNEL_POOL_SIZE: ${MAVNA_CHANNEL_POOL_SIZE:-}
      MAVNA_SETTLEMENTS_PER_CLIENT: ${MAVNA_SETTLEMENTS_PER_CLIENT:-}
      # Optional. With it, the sponsor proxies Soroswap so the key stays here.
      SOROSWAP_API_KEY: ${SOROSWAP_API_KEY:-}
      MAVNA_ARRIVAL_CONTRACT: ${MAVNA_ARRIVAL_CONTRACT:-}
      MAVNA_ARRIVAL_EXECUTOR_SECRET: ${MAVNA_ARRIVAL_EXECUTOR_SECRET:-}
      PORT: "8787"

volumes:
  sponsor-state:
