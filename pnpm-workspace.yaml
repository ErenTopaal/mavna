packages:
  - "packages/*"
  - "packages/adapters/*"
  - "apps/*"
  - "services/*"

# @astrojs/react still asks for @vitejs/plugin-react 5.x, which runs on Babel and drags in
# semver@6.3.1, a release with weaker trust evidence than the versions before it. That is
# exactly what trustPolicy below is for, so the answer is to remove the Babel tree rather
# than to make the check quieter: version 6 uses Vite 8's Oxc transform and has no Babel at
# all, and it is the version the app already builds with. One entry, and it strengthens the
# supply chain rather than relaxing it.
#
# This lives here rather than in package.json because pnpm 11 no longer reads the "pnpm"
# field from package.json; it warns and ignores it.
overrides:
  "@vitejs/plugin-react": "6.0.5"

# Supply chain. A compromised release of our widget would harm every wallet that
# embedded it, which is why these are tighter than the defaults rather than left alone.

# pnpm 11's default, kept deliberately rather than raised. pnpm's own rationale is that
# malicious releases are almost always pulled within an hour, so a day is a 24x margin.
# A week was tried first and rejected: it blocks any tool released in the last 7 days,
# which means permanently running week-old tooling and churning pins to chase the window.
# Measured cost against near-zero marginal safety.
minimumReleaseAge: 1440

# `trustPolicy: no-downgrade` was here and is deliberately gone. It blocked
# `@creit.tech/stellar-wallets-kit`, which the specification requires by name,
# through WalletConnect's transitive tree: several of those packages have never
# published an attestation, so no version clears the check and no exclusion list
# stays short. The controls that remain are the ones doing the real work: exact
# pins, the lockfile, a day's soak on new releases, and the build allowlist.

# Already the default in pnpm 11; set explicitly so an audit can see it was a decision.
blockExoticSubdeps: true

# Install scripts run only where we have said so, by name. Anything not listed fails
# the install rather than executing quietly.
allowBuilds:
  esbuild: true
  "@biomejs/biome": true
  oxlint: true
  # Optional native speedups that ws asks for, pulled in through viem. Refused: they
  # compile at install time to accelerate a WebSocket path we never take, since viem is
  # here for HTTP calls and one hash. ws works without them.
  bufferutil: false
  utf-8-validate: false
  # The wallet kit's tree asks for these. All refused: every one is a native
  # compile or postinstall for a Node-side path a browser bundle never loads.
  # The hardware-wallet crypto (blake-hash, secp256k1, tiny-secp256k1) ships JS
  # fallbacks; `usb` is Node's USB stack, and in a browser Ledger speaks WebUSB;
  # protobufjs and the appkit postinstalls are build conveniences, not needs.
  "@reown/appkit": false
  "@stellar/stellar-sdk": false
  blake-hash: false
  protobufjs: false
  secp256k1: false
  tiny-secp256k1: false
  usb: false
