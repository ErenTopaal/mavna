<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mavna</title>
    <meta name="description" content="Move value onto Stellar from wherever it already is." />
    <link rel="icon" type="image/png" href="/mavna-mark.png" />
    <!--
      The interface is dark only, by design. color-scheme dark keeps the browser's
      own furniture (scrollbars, form controls) dark, and the inline background
      paints the ground before the first frame so there is no white flash.
    -->
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body {
        background: oklch(0.145 0 0);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
