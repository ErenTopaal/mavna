<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mavna</title>
    <meta name="description" content="Move value onto Stellar from wherever it already is." />
    <!-- So the browser's own furniture, scrollbars and form controls, matches. -->
    <meta name="color-scheme" content="light dark" />
    <!--
      Set before the first paint, on purpose.

      This has to be a blocking inline script rather than something React does on
      mount: a class applied after hydration means one frame of a white page on a
      dark machine, and a flash of the wrong theme is worse than not having the
      theme at all. It is a class rather than only a media query because the
      component library's own dark rules are written as `.dark *` and would not
      fire otherwise.
    -->
    <script>
      if (matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
