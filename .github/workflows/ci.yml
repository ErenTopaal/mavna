name: ci

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned by commit, not tag. A tag can be moved; a commit cannot.
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:exports
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      # Chromium only. The widget's guarantees here are about the cascade and the
      # box model, which do not differ across engines in ways this suite asserts;
      # installing three browsers to re-check the same computed styles would cost
      # minutes per run and catch nothing.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm publish:check
