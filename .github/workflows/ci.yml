name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository, and install scripts from third-party
# packages run with this token in reach.
permissions:
  contents: read

# Actions are pinned by commit, not tag. A tag can be moved; a commit cannot.
jobs:
  check:
    runs-on: ubuntu-24.04
    # A production build of the app, playground, landing or docs refuses to run
    # without the sponsor it will call. This build is never hosted, so it names
    # the local one; the browser tests build with their own.
    env:
      VITE_MAVNA_SPONSOR_URL: http://localhost:8787
      NEXT_PUBLIC_MAVNA_SPONSOR_URL: http://localhost:8787
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      # A wallet team evaluating this widget checks its size before they read a
      # line of the docs, so the budget is a build gate rather than a note.
      - run: pnpm size
      # Chromium only. The widget's guarantees here are about the cascade and the
      # box model, which do not differ across engines in ways this suite asserts;
      # installing three browsers to re-check the same computed styles would cost
      # minutes per run and catch nothing.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm publish:check

  # The only on-chain component. The hash check is what ties the source to the
  # deployed wasm, so a change that alters the bytes fails here unless the
  # README's deployments table moves with it.
  arrival:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    env:
      STELLAR_CLI_VERSION: 28.1.0
      # sha256 of stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz, as GitHub lists it for the release
      STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup on the runner reads contracts/rust-toolchain.toml and installs the
      # pinned toolchain, target and components on first use.
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # the release binary links libdbus, which a minimal image may lack
      - name: install stellar-cli
        run: |
          sudo apt-get install -y --no-install-recommends libdbus-1-3
          archive="stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/$archive"
          echo "$STELLAR_CLI_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" stellar
          echo "STELLAR=$RUNNER_TEMP/stellar" >> "$GITHUB_ENV"
      - run: ../scripts/check-arrival-wasm.sh
